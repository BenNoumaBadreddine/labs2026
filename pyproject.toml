[project]
name = "LLMDemo"
version = "1.0.0"
description = "LLM demo project"
readme = "README.md"
license = "MIT"
authors = [
  { name = "Badreddine Ben Nouma", email = "badreddine.ben.nouma@gmail.com" },
]
requires-python = ">=3.12,<4"
dependencies = [
  "pandas>=2.3.1,<3.0.0",
  "numpy>=2.0.0,<3.0.0",
]

[project.scripts]


[tool.poetry]
package-mode = true
packages = [
  { include = "common", from = "src" }
]

[tool.poetry.group.dev.dependencies]
pytest = "8.4.1"
pytest-cov = "6.2.1"
pytest-asyncio = "1.0.0"
coverage = "7.9.1"
black = "25.1.0"
isort = "^5.13.2"
debugpy = "1.8.14"
ipykernel = "^7.2.0"
ruamel-yaml = "^0.18.14"
pre-commit = "^4.3.0"
jupyterlab = "^4.5.3"
nbstripout = "^0.8.1"
ipywidgets = "^8.1.8"
ipython = "^9.10.0"
pylint = "^3.3.7"
flake8 = "^7.3.0"


[tool.black]
target-version = ["py312"]

[tool.isort]
profile = "black"
use_parentheses = true
skip_gitignore = true
extend_skip = [".venv", "__pycache__", ".git"]
force_alphabetical_sort_within_sections = true
combine_as_imports = true

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
