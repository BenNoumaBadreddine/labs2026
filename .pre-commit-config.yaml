repos:
  - repo: local
    hooks:
    - id: pylint
      name: pylint
      entry: poetry run pylint
      language: system
      types: [python]
      args: [--rcfile=./.pylintrc, -sn, -rn]
      files: ^src/.*\.py$
    - id: black
      name: black
      entry: poetry run black
      language: system
      types: [python]
      args: [src/]
    - id: isort
      name: isort
      entry: poetry run isort
      language: system
      types: [python]
      args: [--profile, black, --quiet, --diff, --check-only, src/]
    - id: flake8
      name: flake8
      entry: poetry run flake8
      language: system
      types: [python]
      args: [src/]
    - id: csharpier-ps1
      name: Run CSharpier PowerShell Script
      entry: pwsh scripts/csharpier.ps1
      language: system
      pass_filenames: false
      description: Checks and formats staged C# files using CSharpier.
    - id: nbstripout
      name: nbstripout
      entry: poetry run nbstripout
      language: system
      pass_filenames: true
      files: ^notebooks/.*\.ipynb$
  - repo: https://github.com/commitizen-tools/commitizen
    hooks:
      - id: commitizen
    rev: v3.13.0
